[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t3cc"
version = "0.1.0"
description = "Move conversation history between Claude Code and T3 Code"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
t3cc = "t3cc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["t3cc"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
